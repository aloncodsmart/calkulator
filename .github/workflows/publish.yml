name: Publish the app

# Rebuilds the site on GitHub Pages (https://aloncodsmart.github.io/calkulator/) from the
# repository's default branch. Installed copies pick up the new version on their next launch.
on:
  push:
    branches: [main, claude/smart-math-learning-app-8bymlr]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-app
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to the gh-pages branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish the app (built from ${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
