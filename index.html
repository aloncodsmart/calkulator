<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="מתמטיקה חכמה – עוזר שיעורי בית במתמטיקה שמלמד איך לפתור: משפטים, מושגים, נוסחאות, פותר צעד-אחר-צעד ותרגול." />
    <meta name="theme-color" content="#6d28d9" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>מתמטיקה חכמה</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var s = JSON.parse(localStorage.getItem('smart-math:v1') || '{}');
        var t = (s.settings && s.settings.theme) || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
